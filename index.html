<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenLink</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root { --bg: #080b0f; --surface: #0f1318; --accent: #00d4aa; --accent2: #0077ff; --text: #dde3ec; --muted: #5a6a80; --border: #1f2733; }
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; padding: 20px; }
.container { max-width: 720px; margin: 0 auto; }
.step { background: var(--surface); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; border-radius: 8px; }
textarea { width: 100%; background: #000; color: var(--accent); border: 1px solid var(--border); padding: 10px; font-family: monospace; }
button { cursor: pointer; padding: 10px 20px; background: var(--accent2); color: #fff; border: none; border-radius: 4px; }
button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="container">
  <h1>ScreenLink</h1>
  
  <div id="sharePanel" class="step">
    <h3>1. Start Sharing</h3>
    <button id="sCaptureBtn" onclick="startCapture()">Start Capture</button>
    <video id="localVideo" autoplay muted playsinline style="width:100%; display:none;"></video>
    
    <h3>2. Generate Offer</h3>
    <button id="sOfferBtn" onclick="createOffer()" disabled>Generate Offer</button>
    <textarea id="sOfferBlob" readonly rows="4"></textarea>
    
    <h3>3. Connect</h3>
    <textarea id="sAnswerBlob" placeholder="Paste viewer answer here..." oninput="sAnswerChanged()"></textarea>
    <button id="sConnectBtn" onclick="applyAnswer()" disabled>Connect</button>
  </div>

  <div id="viewPanel" class="step">
    <h3>1. Paste Offer</h3>
    <textarea id="vOfferBlob" placeholder="Paste host offer here..." oninput="vOfferChanged()"></textarea>
    <button id="vAnswerBtn" onclick="createAnswer()" disabled>Generate Answer</button>
    
    <h3>2. View</h3>
    <video id="remoteVideo" autoplay playsinline style="width:100%; background:#000;"></video>
  </div>
</div>

<script>
// ── CONFIGURATION ──
const ICE_CFG = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  // If connection fails across networks, you MUST add a TURN server here:
  // { urls: 'turn:your-turn-server', username: 'user', credential: 'password' }
]};

let hostPC, viewerPC, localStream;

// ── UTILS ──
const encode = obj => btoa(JSON.stringify(obj));
const decode = str => JSON.parse(atob(str.trim()));

// ── CORE LOGIC ──
async function startCapture() {
  localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  document.getElementById('localVideo').srcObject = localStream;
  document.getElementById('localVideo').style.display = 'block';
  document.getElementById('sOfferBtn').disabled = false;
}

async function createOffer() {
  hostPC = new RTCPeerConnection(ICE_CFG);
  hostPC.oniceconnectionstatechange = () => console.log("Host ICE State:", hostPC.iceConnectionState);
  localStream.getTracks().forEach(t => hostPC.addTrack(t, localStream));
  
  const offer = await hostPC.createOffer();
  await hostPC.setLocalDescription(offer);
  
  // Wait for ICE gathering
  setTimeout(() => {
    document.getElementById('sOfferBlob').value = encode(hostPC.localDescription);
  }, 2000);
}

function sAnswerChanged() {
  document.getElementById('sConnectBtn').disabled = document.getElementById('sAnswerBlob').value.length < 10;
}

async function applyAnswer() {
  const desc = decode(document.getElementById('sAnswerBlob').value);
  await hostPC.setRemoteDescription(desc);
  alert("Connected!");
}

function vOfferChanged() {
  document.getElementById('vAnswerBtn').disabled = document.getElementById('vOfferBlob').value.length < 10;
}

async function createAnswer() {
  const offer = decode(document.getElementById('vOfferBlob').value);
  viewerPC = new RTCPeerConnection(ICE_CFG);
  viewerPC.oniceconnectionstatechange = () => console.log("Viewer ICE State:", viewerPC.iceConnectionState);
  
  viewerPC.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
  await viewerPC.setRemoteDescription(offer);
  
  const answer = await viewerPC.createAnswer();
  await viewerPC.setLocalDescription(answer);
  
  setTimeout(() => {
    alert("Copy this to Host: " + encode(viewerPC.localDescription));
  }, 2000);
}
</script>
</body>
</html>
